<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>EarnHub Admin Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}body{font-family:Poppins,sans-serif;background:#0b1020;color:#f5f7ff;min-height:100vh}.container{width:min(1050px,92%);margin:auto}.topbar{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:22px 0}.brand{font-size:24px;font-weight:700}button{border:0;cursor:pointer;font-family:inherit}.logout{background:#222c46;color:#fff;padding:10px 15px;border-radius:10px}.login-wrap{min-height:80vh;display:grid;place-items:center}.login-card{width:min(420px,100%);background:#121a2e;border:1px solid #202b46;border-radius:18px;padding:28px}.login-card h1{margin-bottom:8px}.muted{color:#9ca8c2;font-size:14px;line-height:1.6}input{width:100%;margin-top:14px;padding:13px 14px;border-radius:10px;border:1px solid #2b3857;background:#0d1426;color:#fff;outline:none}.login-btn{width:100%;margin-top:14px;padding:13px;border-radius:10px;background:#4f7cff;color:white;font-weight:600}.error{margin-top:14px;color:#ff8e8e;font-size:13px;line-height:1.5}.dashboard{display:none;padding-bottom:50px}.welcome{background:#121a2e;border:1px solid #202b46;border-radius:16px;padding:18px;margin-bottom:18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.stat{background:#121a2e;border:1px solid #202b46;border-radius:16px;padding:22px}.stat-label{color:#9ca8c2;font-size:13px;margin-bottom:10px}.stat-value{font-size:30px;font-weight:700}.status{margin-top:18px;color:#9ca8c2;font-size:13px;line-height:1.6}@media(max-width:800px){.stats{grid-template-columns:repeat(2,1fr)}}@media(max-width:480px){.stats{grid-template-columns:1fr}.topbar{align-items:flex-start}}
</style>
</head>
<body><div class="container">
<div id="loginSection" class="login-wrap"><div class="login-card"><h1>EarnHub Admin</h1><p class="muted">Login with your authorized admin account.</p><input id="email" type="email" value="rajeevparmar74@gmail.com" placeholder="Admin email" autocomplete="username"><input id="password" type="password" placeholder="Password" autocomplete="current-password"><button id="loginBtn" class="login-btn">Login</button><div id="loginError" class="error"></div></div></div>
<div id="dashboardSection" class="dashboard"><div class="topbar"><div class="brand">EarnHub Admin</div><button id="logoutBtn" class="logout">Logout</button></div><div class="welcome"><strong>Dashboard</strong><p id="adminEmail" class="muted"></p></div><div class="stats"><div class="stat"><div class="stat-label">Total Visitors</div><div id="totalVisitors" class="stat-value">Loading...</div></div><div class="stat"><div class="stat-label">Today's Visitors</div><div id="todayVisitors" class="stat-value">Loading...</div></div><div class="stat"><div class="stat-label">Telegram Clicks</div><div id="telegramClicks" class="stat-value">Loading...</div></div><div class="stat"><div class="stat-label">CTR</div><div id="ctr" class="stat-value">Loading...</div></div></div><div id="dashboardStatus" class="status"></div></div>
</div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import {getFirestore,collection,getDocs} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyDpJ6HdWauG2jF0TjC8XiH1QNOc1hYZs70",authDomain:"landing-page-c5874.firebaseapp.com",projectId:"landing-page-c5874",storageBucket:"landing-page-c5874.firebasestorage.app",messagingSenderId:"790444283513",appId:"1:790444283513:web:15b61b2d681ed30b5a26a8",measurementId:"G-F1ZFEE8SMY"};
const ADMIN_EMAIL="rajeevparmar74@gmail.com";const app=initializeApp(firebaseConfig);const auth=getAuth(app);const db=getFirestore(app);
const loginSection=document.getElementById("loginSection"),dashboardSection=document.getElementById("dashboardSection"),loginBtn=document.getElementById("loginBtn"),logoutBtn=document.getElementById("logoutBtn"),emailInput=document.getElementById("email"),passwordInput=document.getElementById("password"),loginError=document.getElementById("loginError"),adminEmail=document.getElementById("adminEmail"),dashboardStatus=document.getElementById("dashboardStatus");
function showLogin(){loginSection.style.display="grid";dashboardSection.style.display="none"}function showDashboard(user){loginSection.style.display="none";dashboardSection.style.display="block";adminEmail.textContent="Signed in as: "+user.email}
loginBtn.addEventListener("click",async()=>{loginError.textContent="";const email=emailInput.value.trim(),password=passwordInput.value;if(!email||!password){loginError.textContent="Email aur password dono enter karo.";return}try{await signInWithEmailAndPassword(auth,email,password)}catch(e){console.error(e);loginError.textContent="Login failed: "+(e.code||e.message)}});passwordInput.addEventListener("keydown",e=>{if(e.key==="Enter")loginBtn.click()});logoutBtn.addEventListener("click",()=>signOut(auth));
function toDate(v){return v&&typeof v.toDate==="function"?v.toDate():null}
async function loadDashboardStats(){dashboardStatus.textContent="Firebase data load ho raha hai...";try{const [visitsSnapshot,clicksSnapshot]=await Promise.all([getDocs(collection(db,"visits")),getDocs(collection(db,"telegram_clicks"))]);const total=visitsSnapshot.size,clicks=clicksSnapshot.size;const now=new Date(),start=new Date(now.getFullYear(),now.getMonth(),now.getDate()),end=new Date(now.getFullYear(),now.getMonth(),now.getDate()+1);let today=0;visitsSnapshot.forEach(doc=>{const d=toDate(doc.data().visitedAt);if(d&&d>=start&&d<end)today++});const ctr=total?((clicks/total)*100).toFixed(2):"0.00";document.getElementById("totalVisitors").textContent=total;document.getElementById("todayVisitors").textContent=today;document.getElementById("telegramClicks").textContent=clicks;document.getElementById("ctr").textContent=ctr+"%";dashboardStatus.textContent="Data successfully load ho gaya. Last checked: "+new Date().toLocaleString()}catch(e){console.error("Dashboard data error:",e);for(const id of ["totalVisitors","todayVisitors","telegramClicks","ctr"])document.getElementById(id).textContent="Error";dashboardStatus.textContent="Firebase data load nahi ho saka. Error: "+(e.code||e.message)+" — Firestore Rules check karo."}}
onAuthStateChanged(auth,async user=>{if(!user){showLogin();return}if((user.email||"").toLowerCase()!==ADMIN_EMAIL.toLowerCase()){await signOut(auth);loginError.textContent="Is account ko admin dashboard access nahi hai.";showLogin();return}showDashboard(user);await loadDashboardStats()});
</script></body></html>
